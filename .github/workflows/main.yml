name: Koer C25 Aktie Agent Dagligt

on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Hent koden fra Github
        uses: actions/checkout@v4

      - name: Saet Python op
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer pakker
        run: |
          pip install yfinance pandas

      - name: Koer scriptet
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_USER: mgl@godtfredlarsen.com
        run: python agent.py
